name: Build ASCII Terminal Reveal

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/ascii.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate typing SVG
        run: |
          python3 << 'PYTHON_SCRIPT'
          import html
          import os

          OUTPUT_PATH = "assets/ascii-art.svg"

          FONT_SIZE = 8
          CHAR_WIDTH = FONT_SIZE * 0.6
          LINE_HEIGHT = FONT_SIZE
          PADDING = 12
