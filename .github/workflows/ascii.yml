name: Build ASCII Terminal Reveal

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/ascii.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate typing SVG
        shell: python3 {0}
        run: |
          import html
          import os

          OUTPUT_PATH = "assets/ascii-art.svg"

          FONT_SIZE = 8
          CHAR_WIDTH = FONT_SIZE * 0.6
          LINE_HEIGHT = FONT_SIZE
          PADDING = 12
          LINE_DELAY = 0.05

          # GitHub Dark Mode Colors (Hardcoded to bypass GitHub's SVG CSS sanitizer)
          BG_COLOR = "#0d1117"
          FG_COLOR = "#c9d1d9"

          ASCII_ART = """:++==+++++++++++++++++++=++++++++++++++++++++++=++=+=++++++++++++++++++++++===++==++===============.
          +%%%%%%%%%%%%%%%@%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%@%%%%%%%@%@%%%%%%%%%@%%%%%%%%%%%%%%%%%%%%%%=
          +%%%%%%%%%%%%%%@%%%%%%%%%%%%%%%%%%@%%%%%%%%%%%%@%@@@@@@@%%@@%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%=
