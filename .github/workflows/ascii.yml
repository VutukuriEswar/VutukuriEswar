.-:::::....  ==......::...:.::.:::::::::::::::.:=. +  =%==-...     .:-------.            ==-------- """

          lines = [l.rstrip() for l in ASCII_ART.split("\n")]
          
          # Strip leading/trailing empty lines caused by triple-quote formatting
          while lines and lines[-1] == "":
              lines.pop()
          while lines and lines[0] == "":
              lines.pop(0)
              
          if not lines:
              raise SystemExit("Empty art")

          w_chars = max(len(l) for l in lines)
          h_chars = len(lines)

          canvas_w = round(w_chars * CHAR_WIDTH + PADDING * 2)
          canvas_h = round(h_chars * LINE_HEIGHT + PADDING * 2)

          y0 = PADDING + FONT_SIZE
          x0 = PADDING

          groups = []
          for i, line in enumerate(lines):
              escaped_line = html.escape(line, quote=False)
              tspan = f'<tspan x="{x0}" y="{round(y0 + i * LINE_HEIGHT, 2)}">{escaped_line}</tspan>'
              begin_time = i * LINE_DELAY
              
              # Each line starts invisible (opacity="0"), snaps to visible (dur="0.01s"), 
              # and stays visible (fill="freeze", repeatCount="1") so it only plays once.
              groups.append(
                  f'<g opacity="0">\n'
                  f'  <animate attributeName="opacity" values="0;1" keyTimes="0;1" '
                  f'dur="0.05s" begin="{begin_time:.3f}s" fill="freeze" repeatCount="1"/>\n'
                  f'  {tspan}\n'
                  f'</g>'
              )

          # Add a blinking cursor that appears after the last line finishes typing
          total_type_time = (len(lines) - 1) * LINE_DELAY + 0.1
          last_line_len = len(lines[-1])
          cursor_x = round(PADDING + last_line_len * CHAR_WIDTH + 2, 2)
          cursor_y = round(y0 + (len(lines) - 1) * LINE_HEIGHT - FONT_SIZE + 2, 2)

          cursor = f'''<rect x="{cursor_x}" y="{cursor_y}" width="{round(CHAR_WIDTH*0.6, 2)}" height="{FONT_SIZE}" fill="var(--fg-color)" opacity="0">
            <animate attributeName="opacity" values="1;0" dur="0.6s" begin="{total_type_time:.3f}s" repeatCount="indefinite" />
          </rect>'''

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{canvas_w}px" height="{canvas_h}px" viewBox="0 0 {canvas_w} {canvas_h}" font-family="Consolas,'Courier New',monospace" font-size="{FONT_SIZE}px">
          <style>
          :root {{
            --bg-color: #ffffff;
            --fg-color: #1f2328;
          }}
          @media (prefers-color-scheme: dark) {{
            :root {{
              --bg-color: #0d1117;
              --fg-color: #c9d1d9;
            }}
          }}
          rect.bg {{ fill: var(--bg-color); }}
          text.art {{ fill: var(--fg-color); white-space: pre; }}
          tspan {{ white-space: pre; }}
          </style>
          <rect class="bg" width="{canvas_w}" height="{canvas_h}" rx="12"/>
          <text class="art" xml:space="preserve">
          {chr(10).join(groups)}
          </text>
          {cursor}
          </svg>'''

          os.makedirs(os.path.dirname(OUTPUT_PATH), exist_ok=True)
          with open(OUTPUT_PATH, "w", encoding="utf-8") as f:
              f.write(svg)
          print(f"Wrote {OUTPUT_PATH}: {canvas_w}x{canvas_h}px, Terminal reveal animation")
          PYTHON_SCRIPT

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ascii-art.svg
          git diff --staged --quiet || git commit -m "Rebuild ASCII terminal reveal"
          git push
