:%%@@@@@%%*#*#%@@#%%%@@%#%%#%%#%%%%@%%%%##@@ %* @%%%%@@@  +@@***#%%%%%%@%%@%@.+*%@%%%###-:@@@%@%%%%.
:%%%%@%%#%#+#*@##@%%@%#####%%%%@%%%%%%%%%%%@@   @@@@@@@   @@%####%%%%%%##%%%@=+%+-==+++*:=@@%%##%%%.
:#%%@@%%%@#*+*@@@%*##%%####%#%#%%%%%%%%%%%%%@@  .@@@@@@  %@@%####%%%%@%@@%%@@=-*#%@@%%@#.+@@@@@@%#%.
:#%%%%#####*+-*@@@@@##%%%%%@%@%@%%%%%%%%%@@@@@@  @@%@@   @@%***####%%%%%%%%@@==#@%##*##+.#@%%%%%%%%:
:#%%%%%@%%#%%. @@%#%%@%%%%%%%%%@@@%%%@%%%%%%%@@@  @@@@  @@%%##**#%%%%%%%@%%%@+-%++**###+.#@%%%%%%%%:
:%%%%%%%##%%%.+@%###%%#@%#%#%%%%%%#%#%#%%%####@@= @@@  @@@%%##**####%%%%%%%@%+-=*######--@%#%%%%%#%:
